<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2a33">
  <title>Fishalyzer</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="top">
    <button id="burger" aria-label="Menu" aria-expanded="false">☰</button>
    <a href="#today" class="brand">🎣 Fishalyzer</a>
    <a href="#log" class="logbtn">＋ Log</a>
  </header>
  <div id="statusbar" title="Tap for details"></div>
  <div id="menu" hidden>
    <nav>
      <a href="#today" data-tab="today"><span>🎣</span>Today</a>
      <a href="#calendar" data-tab="calendar"><span>📅</span>Calendar</a>
      <a href="#insights" data-tab="insights"><span>📊</span>Insights</a>
      <a href="#spots" data-tab="spots"><span>📍</span>Spots</a>
      <a href="#feedback" data-tab="feedback"><span>💬</span>Feedback</a>
    </nav>
  </div>
  <main id="view"></main>
  <div id="modal" hidden><div class="sheet"><button class="close" aria-label="Close">✕</button><div class="body"></div></div></div>
  <div id="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
